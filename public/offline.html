<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f43f5e" />
    <title>Care For Shweta Offline</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff8fa;
        color: #334155;
      }
      main {
        max-width: 680px;
        margin: 0 auto;
        padding: 48px 20px;
      }
      section {
        border: 1px solid #ffe4e6;
        border-radius: 24px;
        background: white;
        padding: 28px;
        box-shadow: 0 10px 24px rgba(244, 63, 94, 0.08);
      }
      h1 {
        margin: 0;
        color: #be123c;
      }
      p {
        line-height: 1.6;
      }
      a {
        color: #e11d48;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Care For Shweta is offline</h1>
        <p>
          Your cached dashboard, medicines, and reports are available when the app shell has been opened before.
          Reconnect to sync fresh assets or cloud data.
        </p>
        <a href="/">Return to dashboard</a>
      </section>
    </main>
  </body>
</html>
